name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run project regression tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
          done

      - name: Check for security header config
        run: |
          test -f _headers
          grep -q '^/\*$' _headers
          grep -q '^/assets/\*$' _headers
          grep -q '^[[:space:]]*Strict-Transport-Security:' _headers
          grep -q '^[[:space:]]*Content-Security-Policy:' _headers
          grep -q '^[[:space:]]*X-Content-Type-Options: nosniff' _headers
          grep -q '^[[:space:]]*Referrer-Policy:' _headers
          grep -q '^[[:space:]]*Cache-Control: public, max-age=31536000, immutable' _headers
